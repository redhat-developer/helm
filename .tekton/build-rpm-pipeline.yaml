apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: helm-build-srpm-pipeline
  labels:
    app.kubernetes.io/part-of: helm
spec:
  description: |
    Build SRPM and el9 RPMs for Helm and assemble a container image carrying /rpms/* for Koji import.

  params:
    - name: git_url
      type: string
      description: Git repository URL to clone
    - name: git_revision
      type: string
      description: Git revision (branch, tag, or SHA) to checkout
      default: main
    - name: version
      type: string
      description: Version to use for the RPMs and image tag. If empty, detect from ./VERSION or git tag.
      default: ""
    - name: output_image
      type: string
      description: Fully-qualified image name to push (without tag), e.g. quay.io/org/helm-rpms
    - name: enable_prefetch
      type: string
      description: If "true", run prefetch hook before build (hermetic-ready)
      default: "false"
    - name: prefetch_cmd
      type: string
      description: Optional shell command to prefetch dependencies
      default: ""

  workspaces:
    - name: shared-workspace
      description: Shared workspace for source and outputs

  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.git_url)
        - name: revision
          value: $(params.git_revision)
        - name: depth
          value: "0"
        - name: submodules
          value: "false"
        - name: deleteExisting
          value: "true"
        - name: subdirectory
          value: source
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: set-version
      runAfter: [git-clone]
      taskSpec:
        params:
          - name: version
            type: string
        results:
          - name: version
            description: Resolved version string
          - name: git-sha
            description: Short git SHA for tagging
        workspaces:
          - name: ws
        steps:
          - name: detect-version
            image: registry.access.redhat.com/ubi9/ubi:latest
            workingDir: $(workspaces.ws.path)/source
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              mkdir -p "$(workspaces.ws.path)/output"

              INPUT_VERSION="$(params.version)"
              RESOLVED_VERSION=""
              if [[ -n "${INPUT_VERSION}" ]]; then
                RESOLVED_VERSION="${INPUT_VERSION}"
              elif [[ -f VERSION && -s VERSION ]]; then
                RESOLVED_VERSION="$(cat VERSION)"
              else
                if git describe --tags --abbrev=0 >/dev/null 2>&1; then
                  RESOLVED_VERSION="$(git describe --tags --abbrev=0)"
                else
                  RESOLVED_VERSION="$(git rev-parse --short=12 HEAD)"
                fi
              fi

              GIT_SHA="$(git rev-parse --short=12 HEAD)"

              printf "%s" "${RESOLVED_VERSION}" > "$(workspaces.ws.path)/output/VERSION"
              printf "%s" "${RESOLVED_VERSION}" > "$(results.version.path)"
              printf "%s" "${GIT_SHA}" > "$(results.git-sha.path)"
      params:
        - name: version
          value: $(params.version)
      workspaces:
        - name: ws
          workspace: shared-workspace

    - name: prefetch
      when:
        - input: $(params.enable_prefetch)
          operator: in
          values: ["true"]
      runAfter: [git-clone]
      taskSpec:
        params:
          - name: prefetch_cmd
            type: string
        workspaces:
          - name: ws
        steps:
          - name: run-prefetch
            image: registry.access.redhat.com/ubi9/ubi:latest
            workingDir: $(workspaces.ws.path)/source
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              if [[ -n "$(params.prefetch_cmd)" ]]; then
                echo "Running prefetch command"
                bash -lc "$(params.prefetch_cmd)"
              else
                echo "No prefetch command provided; skipping."
              fi
      params:
        - name: prefetch_cmd
          value: $(params.prefetch_cmd)
      workspaces:
        - name: ws
          workspace: shared-workspace

    - name: build-srpm
      runAfter: [set-version]
      taskSpec:
        workspaces:
          - name: ws
        steps:
          - name: build
            image: registry.access.redhat.com/ubi9/ubi:latest
            workingDir: $(workspaces.ws.path)/source
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Install required tooling for SRPM build in UBI
              microdnf -y install rpm-build rpmdevtools golang make findutils rsync tar gzip | sed -n 's/^/  /p'

              export VERSION="$(cat "$(workspaces.ws.path)/output/VERSION")"
              export TOPDIR="$(workspaces.ws.path)"
              export SOURCE_DIR="$(workspaces.ws.path)/source"

              bash "${SOURCE_DIR}/scripts/rpm/build_srpm.sh"

    - name: stage-and-hash
      runAfter: [build-srpm]
      taskSpec:
        workspaces:
          - name: ws
        steps:
          - name: stage
            image: registry.access.redhat.com/ubi9/ubi:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              OUT_DIR="$(workspaces.ws.path)/output/rpms"
              REPO_DIR="$(workspaces.ws.path)/source"
              mkdir -p "${REPO_DIR}/rpms/SRPMS"
              cp -a "${OUT_DIR}/SRPMS/"*.src.rpm "${REPO_DIR}/rpms/SRPMS/"
              cd "${REPO_DIR}/rpms"
              LC_ALL=C ls -1 SRPMS/*.src.rpm | LC_ALL=C sort | xargs -r sha256sum > sha256sum.txt

    - name: build-image
      runAfter: [stage-and-hash]
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: $(params.output_image):srpm-v$(tasks.set-version.results.version)
        - name: CONTEXT
          value: $(workspaces.source.path)/source
        - name: DOCKERFILE
          value: Containerfile.rpms
        - name: TLSVERIFY
          value: "true"
        - name: SKIP_PUSH
          value: "false"
        - name: ADDITIONAL_TAGS
          value: srpm-$(tasks.set-version.results.git-sha)
      workspaces:
        - name: source
          workspace: shared-workspace

  results:
    - name: version
      value: $(tasks.set-version.results.version)
    - name: git-sha
      value: $(tasks.set-version.results.git-sha)



